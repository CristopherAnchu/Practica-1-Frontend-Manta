<div class="container mt-3">
  <h3>Mis Rutinas</h3>

  <form id="rt_form" (submit)="crear($event)" class="mb-3">
    <div class="mb-2">
      <input id="rt_titulo" class="form-control" placeholder="Título de la rutina" />
    </div>
    <div class="mb-2">
      <textarea id="rt_descripcion" class="form-control" placeholder="Descripción (opcional)"></textarea>
    </div>
    <button class="btn btn-primary">Crear rutina</button>
  </form>

  <div *ngIf="rutinas.length === 0" class="alert alert-info">No tienes rutinas aún.</div>
  <div *ngFor="let r of rutinas" class="card mb-2">
    <div class="card-body d-flex justify-content-between align-items-center">
      <div>
        <h5>{{ r.titulo }}</h5>
        <p class="mb-0">{{ r.descripcion }}</p>
      </div>
      <div>
        <button class="btn btn-danger btn-sm" (click)="eliminar(r.id)">Eliminar</button>
      </div>
    </div>
  </div>
</div>
