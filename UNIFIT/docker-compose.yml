version: '3.8'

services:
  # ==================== DATABASES ====================
  
  postgres:
    image: postgres:16-alpine
    container_name: unifit-postgres
    environment:
      POSTGRES_USER: unifit
      POSTGRES_PASSWORD: unifit_password
      POSTGRES_DB: unifit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - unifit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unifit"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: unifit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - unifit-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==================== MICROSERVICES ====================

  # Auth Service (NestJS)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: unifit-auth
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://unifit:unifit_password@postgres:5432/unifit_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: unifit-access-secret-2026
      JWT_REFRESH_SECRET: unifit-refresh-secret-2026
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - unifit-network
    restart: unless-stopped

  # Payment Service (NestJS)
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: unifit-payment
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://unifit:unifit_password@postgres:5432/unifit_db
      USE_MOCK_ADAPTER: "true"
      WEBHOOK_BASE_URL: http://localhost:3002
      HMAC_SECRET_KEY: unifit-hmac-secret-2026
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - unifit-network
    restart: unless-stopped

  # AI Orchestrator (Python)
  ai-orchestrator:
    build:
      context: ./ai-orchestrator
      dockerfile: Dockerfile
    container_name: unifit-ai
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://unifit:unifit_password@postgres:5432/unifit_db
      LLM_PROVIDER: mock
      REST_API_URL: http://rest-golang:3000
      GRAPHQL_API_URL: http://graphql:4000/graphql
      PAYMENT_API_URL: http://payment-service:3002
    depends_on:
      - postgres
    networks:
      - unifit-network
    restart: unless-stopped

  # REST API Golang
  rest-golang:
    build:
      context: ./RestGolang
      dockerfile: Dockerfile
    container_name: unifit-rest-golang
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://unifit:unifit_password@postgres:5432/unifit_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - unifit-network
    restart: unless-stopped

  # GraphQL API (NestJS)
  graphql:
    build:
      context: ./graphql
      dockerfile: Dockerfile
    container_name: unifit-graphql
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://unifit:unifit_password@postgres:5432/unifit_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - unifit-network
    restart: unless-stopped

  # WebSocket Server (Python)
  websocket-server:
    build:
      context: ./websocket-server
      dockerfile: Dockerfile
    container_name: unifit-websocket
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      HOST: 0.0.0.0
    networks:
      - unifit-network
    restart: unless-stopped

  # Webhook Service (NodeJS)
  webhook-service:
    build:
      context: ./webhook-service
      dockerfile: Dockerfile
    container_name: unifit-webhook
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
    networks:
      - unifit-network
    restart: unless-stopped

  # n8n Event Bus
  n8n:
    image: n8nio/n8n:latest
    container_name: unifit-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=unifit2026
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/workflows
    networks:
      - unifit-network
    restart: unless-stopped

  # Frontend (Angular)
  frontend:
    build:
      context: ./gym-uleam
      dockerfile: Dockerfile
    container_name: unifit-frontend
    ports:
      - "4200:4200"
    environment:
      - API_URL=http://localhost:3000
      - GRAPHQL_URL=http://localhost:4000/graphql
      - WEBSOCKET_URL=http://localhost:8080
      - AUTH_URL=http://localhost:3001
      - PAYMENT_URL=http://localhost:3002
      - AI_URL=http://localhost:3003
    depends_on:
      - rest-golang
      - graphql
      - websocket-server
      - auth-service
      - payment-service
      - ai-orchestrator
    networks:
      - unifit-network
    restart: unless-stopped

  # ==================== API GATEWAY (Opcional) ====================
  
  # Puedes agregar NGINX o un API Gateway aquí

volumes:
  postgres_data:
  redis_data:
  n8n_data:

networks:
  unifit-network:
    driver: bridge
